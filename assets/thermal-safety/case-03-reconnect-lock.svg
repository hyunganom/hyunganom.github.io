<text x="280.0" y="280.0" class="detail" text-anchor="middle">대기 중에도 글로벌 락 유지</text>
<rect x="635" y="230" width="370" height="60" rx="9" fill="#eaf6f3" stroke="#94c7bf" stroke-width="1.5"/>
