<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 400" width="1080" height="400" role="img" aria-labelledby="title desc">
<title id="title">V2X 한 구간의 저장과 복구</title><desc id="desc">전용 세션의 Worker 잠금. 한 트랜잭션 안에서 검증과 파티션 준비, 지표·이벤트·체크포인트·공간 데이터 저장. 재시작 시 마지막 커밋 상태를 복원한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#67879a"/></marker></defs>
<rect width="1080" height="400" fill="#f9fcfe"/>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, Segoe UI, sans-serif"><g class="node" data-x="28" data-y="40" data-w="258" data-h="112"><rect x="28" y="40" width="258" height="112" rx="10" fill="#fff" stroke="#cfdce7"/><path d="M38 40 H276" stroke="#277c78" stroke-width="4"/><text x="44" y="72" font-size="18" fill="#193951" font-weight="700" text-anchor="start">Worker 시작</text><path d="M28 87 H286" stroke="#e5edf3"/><text x="44" y="112" font-size="15.5" fill="#43566d" font-weight="400" text-anchor="start">전용 DB 세션</text><text x="44" y="136" font-size="15.5" fill="#43566d" font-weight="400" text-anchor="start">advisory lock 획득</text></g><polyline points="286,97 328,97" fill="none" stroke="#67879a" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="40" width="722" height="220" rx="14" fill="#eaf5f2" stroke="#99c9c0"/><text x="352" y="73" font-size="20" fill="#205d57" font-weight="700" text-anchor="start">BEGIN → 한 구간의 트랜잭션 → COMMIT</text><g class="node" data-x="352" data-y="98" data-w="210" data-h="114"><rect x="352" y="98" width="210" height="114" rx="10" fill="#fff" stroke="#cfdce7"/><path d="M362 98 H552" stroke="#277c78" stroke-width="4"/><text x="368" y="130" font-size="18" fill="#193951" font-weight="700" text-anchor="start">검증 · 파티션 준비</text><path d="M352 145 H562" stroke="#e5edf3"/><text x="368" y="170" font-size="15.5" fill="#43566d" font-weight="400" text-anchor="start">보존 작업과 공통 잠금</text><text x="368" y="194" font-size="15.5" fill="#43566d" font-weight="400" text-anchor="start">체크포인트·요청 비교</text></g><g class="node" data-x="587" data-y="98" data-w="210" data-h="114"><rect x="587" y="98" width="210" height="114" rx="10" fill="#fff" stroke="#cfdce7"/><path d="M597 98 H787" stroke="#277c78" stroke-width="4"/><text x="603" y="130" font-size="18" fill="#193951" font-weight="700" text-anchor="start">지표 · 이벤트 저장</text><path d="M587 145 H797" stroke="#e5edf3"/><text x="603" y="170" font-size="15.5" fill="#43566d" font-weight="400" text-anchor="start">지표 INSERT</text><text x="603" y="194" font-size="15.5" fill="#43566d" font-weight="400" text-anchor="start">사건 UPSERT</text></g><g class="node" data-x="822" data-y="98" data-w="208" data-h="114"><rect x="822" y="98" width="208" height="114" rx="10" fill="#fff" stroke="#cfdce7"/><path d="M832 98 H1020" stroke="#277c78" stroke-width="4"/><text x="838" y="130" font-size="18" fill="#193951" font-weight="700" text-anchor="start">복구 · 공간 저장</text><path d="M822 145 H1030" stroke="#e5edf3"/><text x="838" y="170" font-size="15.5" fill="#43566d" font-weight="400" text-anchor="start">체크포인트 UPSERT</text><text x="838" y="194" font-size="15.5" fill="#43566d" font-weight="400" text-anchor="start">공간 데이터 INSERT</text></g><polyline points="562,156 587,156" fill="none" stroke="#67879a" stroke-width="2" marker-end="url(#arrow)"/><polyline points="797,156 822,156" fill="none" stroke="#67879a" stroke-width="2" marker-end="url(#arrow)"/><text x="352" y="241" font-size="15.5" fill="#43566d" font-weight="400" text-anchor="start">오류 발생 시 전체 ROLLBACK · 성공 시 결과와 다음 계산 위치가 함께 확정</text><g class="node" data-x="28" data-y="208" data-w="258" data-h="114"><rect x="28" y="208" width="258" height="114" rx="10" fill="#fff" stroke="#cfdce7"/><path d="M38 208 H276" stroke="#6b7d91" stroke-width="4"/><text x="44" y="240" font-size="18" fill="#193951" font-weight="700" text-anchor="start">세션 단절</text><path d="M28 255 H286" stroke="#e5edf3"/><text x="44" y="280" font-size="15.5" fill="#43566d" font-weight="400" text-anchor="start">적재 중단</text><text x="44" y="304" font-size="15.5" fill="#43566d" font-weight="400" text-anchor="start">자동 재접속으로 우회하지 않음</text></g><polyline points="157,152 157,208" fill="none" stroke="#67879a" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="300" width="722" height="70" rx="10" fill="#edf1f8" stroke="#bac9de"/><text x="352" y="327" font-size="17" fill="#294b76" font-weight="700" text-anchor="start">재시작: 잠금 재획득 → 마지막 커밋 체크포인트 조회 → 계산 상태 복원</text><text x="352" y="353" font-size="15" fill="#43566d" font-weight="400" text-anchor="start">커밋되지 않은 수신 큐 입력은 이 복구 범위에 포함되지 않음</text><polyline points="690,260 690,300" fill="none" stroke="#67879a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><polyline points="286,265 309,265 309,335 330,335" fill="none" stroke="#67879a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/></g></svg>