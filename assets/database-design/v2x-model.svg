<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 540" width="1080" height="540" role="img" aria-labelledby="title desc">
<title id="title">V2X 데이터 저장 구조</title><desc id="desc">여섯 업무 테이블의 핵심 컬럼. 파티션 전환 후 이벤트 기본키는 event_id와 confirmed_ms. 점선은 논리적 연결이며 FK가 아니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#67879a"/></marker></defs>
<rect width="1080" height="540" fill="#f9fcfe"/>
