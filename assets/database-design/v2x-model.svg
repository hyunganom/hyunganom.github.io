="4"/><text x="746" y="90" font-size="18" fill="#193951" font-weight="700" text-anchor="start">incident_episodes</text><path d="M730 105 H1052" stroke="#e5edf3"/><text x="746" y="130" font-size="15.5" fill="#43566d" font-weight="400" text-anchor="start">PK  event_id, confirmed_ms</text><text x="746" y="154" font-size="15.5" fill="#43566d" font-weight="400" text-anchor="start">sector_id · start_ms · end_ms</text><text x="746" y="178" font-size="15.5" fill="#43566d" font-weight="400" text-anchor="start">last_seen_ms · status · severity</text><text x="746" y="202" font-size="15.5" fill="#43566d" font-weight="400" text-anchor="start">evidence_json : TEXT</text></g><g class="node" data-x="28" data-y="330" data-w="320" data-h="162"><rect x="28" y="330" width="320" height="162" rx="10" fill="#fff" stroke="#cfdce7"/><path d="M38 330 H338" stroke="#3b6298" stroke-width="4"/><text x="44" y="362" font-size="18" fill="#193951" font-weight="700" text-anchor="start">metric_checkpoints</text><path d="M28 377 H348" stroke="#e5edf3"/><text x="44" y="402" font-size="15.5" fill="#43566d" font-weight="400" text-anchor="start">PK  sector_id  /  교차로당 1행</text><text x="44" y="426" font-size="15.5" fill="#43566d" font-weight="400" text-anchor="start">next_start_ms</text><text x="44" y="450" font-size="15.5" fill="#43566d" font-weight="400" text-anchor="start">state_json : TEXT</text></g><g class="node" data-x="392" data-y="330" data-w="290" data-h="162"><rect x="392" y="330" width="290" height="162" rx="10" fill="#fff" stroke="#cfdce7"/><path d="M402 330 H672" stroke="#277c78" stroke-width="4"/><text x="408" y="362" font-size="18" fill="#193951" font-weight="700" text-anchor="start">spatial_cells</text><path d="M392 377 H682" stroke="#e5edf3"/><text x="408" y="402" font-size="15.5" fill="#43566d" font-weight="400" text-anchor="start">PK  sector_id, bucket_start_ms,</text><text x="408" y="426" font-size="15.5" fill="#43566d" font-weight="400" text-anchor="start">      kind, gx, gy</text><text x="408" y="450" font-size="15.5" fill="#43566d" font-weight="400" text-anchor="start">min_ttc · samples · 정지/저속 시간</text></g><g class="node" data-x="730" data-y="330" data-w="322" data-h="162"><rect x="730" y="330" width="322" height="162" rx="10" fill="#fff" stroke="#cfdce7"/><path d="M740 330 H1042" stroke="#277c78" stroke-width="4"/><text x="746" y="362" font-size="18" fill="#193951" font-weight="700" text-anchor="start">spatial_episode_peaks</text><path d="M730 377 H1052" stroke="#e5edf3"/><text x="746" y="402" font-size="15.5" fill="#43566d" font-weight="400" text-anchor="start">PK  sector_id, bucket_start_ms,</text><text x="746" y="426" font-size="15.5" fill="#43566d" font-weight="400" text-anchor="start">      episode_id</text><text x="746" y="450" font-size="15.5" fill="#43566d" font-weight="400" text-anchor="start">kind · gx · gy · min_ttc</text></g><polyline points="348,145 392,145" fill="none" stroke="#67879a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><polyline points="537,220 537,330" fill="none" stroke="#67879a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="552" y="275" font-size="15" fill="#43566d" font-weight="400" text-anchor="start">교차로 + 초</text><polyline points="891,330 891,244" fill="none" stroke="#67879a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="908" y="287" font-size="15" fill="#43566d" font-weight="400" text-anchor="start">사건 ID</text><polyline points="188,244 188,330" fill="none" stroke="#67879a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="203" y="290" font-size="15" fill="#43566d" font-weight="400" text-anchor="start">교차로</text><text x="28" y="518" font-size="15" fill="#345b85" font-weight="700" text-anchor="start">체크포인트는 파티션·삭제 대상에서 제외</text><text x="570" y="518" font-size="15" fill="#43566d" font-weight="400" text-anchor="start">점선: 논리적 연결  ·  보존 관리 테이블은 별도</text></g></svg>