l="#43566d" font-weight="400" text-anchor="start">ID  id / 외부 식별자 node_id</text><text x="746" y="156" font-size="15.5" fill="#43566d" font-weight="400" text-anchor="start">inter_nm · sa_id · arnge_idx</text><text x="746" y="180" font-size="15.5" fill="#43566d" font-weight="400" text-anchor="start">교차로 기준 정보</text></g><polyline points="308,132 366,132" fill="none" stroke="#67879a" stroke-width="2" marker-end="url(#arrow)"/><text x="321" y="116" font-size="14" fill="#43566d" font-weight="400" text-anchor="start">1:N</text><polyline points="730,132 664,132" fill="none" stroke="#67879a" stroke-width="2" marker-end="url(#arrow)"/><text x="685" y="116" font-size="14" fill="#43566d" font-weight="400" text-anchor="start">1:N</text><g class="node" data-x="28" data-y="306" data-w="462" data-h="158"><rect x="28" y="306" width="462" height="158" rx="10" fill="#fff" stroke="#cfdce7"/><path d="M38 306 H480" stroke="#277c78" stroke-width="4"/><text x="44" y="338" font-size="18" fill="#193951" font-weight="700" text-anchor="start">sig_tod_table</text><path d="M28 353 H490" stroke="#e5edf3"/><text x="44" y="378" font-size="15.5" fill="#43566d" font-weight="400" text-anchor="start">ID  id / 관계 컬럼 inter_id</text><text x="44" y="402" font-size="15.5" fill="#43566d" font-weight="400" text-anchor="start">ringType · phaseNm · arrowType</text><text x="44" y="426" font-size="15.5" fill="#43566d" font-weight="400" text-anchor="start">minGrTm · maxGrTm · ylwTm · allRedTm</text><text x="44" y="450" font-size="15.5" fill="#43566d" font-weight="400" text-anchor="start">보행자 시간 · 일부 운영 필드</text></g><g class="node" data-x="590" data-y="306" data-w="462" data-h="158"><rect x="590" y="306" width="462" height="158" rx="10" fill="#fff" stroke="#cfdce7"/><path d="M600 306 H1042" stroke="#277c78" stroke-width="4"/><text x="606" y="338" font-size="18" fill="#193951" font-weight="700" text-anchor="start">sig_tod_plan</text><path d="M590 353 H1052" stroke="#e5edf3"/><text x="606" y="378" font-size="15.5" fi