<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 500" width="1080" height="500" role="img" aria-labelledby="title desc">
<title id="title">도시 교통신호 최적화 시스템 도로망과 신호 계획 관계</title><desc id="desc">JPA 기준 도로축과 교차로는 연결 테이블을 통한 다대다 관계. 교차로별 신호 설정과 운영 계획은 각각 일대다. 물리 FK는 확인하지 않았다.</desc>
