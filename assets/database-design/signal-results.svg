<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 500" width="1080" height="500" role="img" aria-labelledby="title desc">
<title id="title">도시 교통신호 최적화 시스템 학습 모델과 실행별 결과</title><desc id="desc">학습 모델과 실행 이력은 JPA 일대다. 실행 UUID와 파일명으로 결과를 논리적으로 연결. 실행별 base와 optimum 테이블은 sim_time과 data JSONB를 저장한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#67879a"/></marker></defs>
<rect width="1080" height="500" fill="#f9fcfe"/>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, Segoe UI, sans-serif"><g class="node" data-x="28" data-y="38" data-w="286" data-h="164"><rect x="28" y="38" width="286" height="164" rx="10" fill="#fff" stroke="#cfdce7"/><path d="M38 38 H304" stroke="#3b6298" stroke-width="4"/><text x="44" y="70" font-size="18" fill="#193951" font-weight="700" text-anchor="start">trn_model_info</text><path d="M28 85 H314" stroke="#e5edf3"/><text x="44" y="110" font-size="15.5" fill="#43566d" font-weight="400" text-anchor="start">ID  id</text><text x="44" y="134" font-size="15.5" fill="#43566d" font-weight="400" text-anchor="start">mdl_uuid · mdl_nm · mdl_status</text><text x="44" y="158" font-size="15.5" fill="#43566d" font-weight="400" text-anchor="start">학습 조건 · 생성/완료 시각</text><text x="44" y="182" font-size="15.5" fill="#43566d" font-weight="400" text-anchor="start">학습 모델 메타데이터</text></g><g class="node" data-x="378" data-y="38" data-w="306" data-h="164"><rect x="378" y="38" width="306" height="164" rx="10" fill="#fff" stroke="#cfdce7"/><path d="M388 38 H674" stroke="#3b6298" stroke-width="4"/><text x="394" y="70" font-size="18" fill="#193951" font-weight="700" text-anchor="start">opt_result_metric_info</text><path d="M378 85 H684" stroke="#e5edf3"/><text x="394" y="110" font-size="15.5" fill="#43566d" font-weight="400" text-anchor="start">ID  id / 관계 컬럼 mdl_id</text><text x="394" y="134" font-size="15.5" fill="#43566d" font-weight="400" text-anchor="start">opt_uuid · route_file</text><text x="394" y="158" font-size="15.5" fill="#43566d" font-weight="400" text-anchor="start">실행 조건 · 생성/완료 시각</text><text x="394" y="182" font-size="15.5" fill="#43566d" font-weight="400" text-anchor="start">sim_start_time · sim_end_time</text></g><g class="node" data-x="758" data-y="38" data-w="294" data-h="164"><rect x="758" y="38" width="294" height="164" rx="10" fill="#fff" stroke="#cfdce7"/><path d="M768 38 H1042" stroke="#3b6298" stroke-width="4"/><text x="774" y="70" font-size="18" fill="#193951" font-weight="700" text-anchor="start">sim_routefile_info</text><path d="M758 85 H1052" stroke="#e5edf3"/><text x="774" y="110" font-size="15.5" fill="#43566d" font-weight="400" text-anchor="start">ID  id</text><text x="774" y="134" font-size="15.5" fill="#43566d" font-weight="400" text-anchor="start">file_name · date_type · time_type</text><text x="774" y="158" font-size="15.5" fill="#43566d" font-weight="400" text-anchor="start">datetime</text><text x="774" y="182" font-size="15.5" fill="#43566d" font-weight="400" text-anchor="start">입력 교통량 파일 메타데이터</text></g><polyline points="314,113 378,113" fill="none" stroke="#67879a" stroke-width="2" marker-end="url(#arrow)"/><text x="327" y="98" font-size="15" fill="#43566d" font-weight="400" text-anchor="start">1:N</text><polyline points="684,113 758,113" fill="none" stroke="#67879a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="697" y="98" font-size="14" fill="#43566d" font-weight="400" text-anchor="start">파일명</text><g class="node" data-x="28" data-y="304" data-w="484" data-h="164"><rect x="28" y="304" width="484" height="164" rx="10" fill="#fff" stroke="#cfdce7"/><path d="M38 304 H502" stroke="#277c78" stroke-width="4"/><text x="44" y="336" font-size="18" fill="#193951" font-weight="700" text-anchor="start">공통 분석 결과 테이블</text><path d="M28 351 H512" stroke="#e5edf3"/><text x="44" y="376" font-size="15.5" fill="#43566d" font-weight="400" text-anchor="start">metric_intersection_summary  /  교차로별</text><text x="44" y="400" font-size="15.5" fill="#43566d" font-weight="400" text-anchor="start">metric_quarter_hourly  /  15분별</text><text x="44" y="424" font-size="15.5" fill="#43566d" font-weight="400" text-anchor="start">metric_signal_info  /  신호별</text><text x="44" y="448" font-size="15.5" fill="#43566d" font-weight="400" text-anchor="start">공통 연결 값: model_id · opt_uuid</text></g><g class="node" data-x="580" data-y="304" data-w="472" data-h="164"><rect x="580" y="304" width="472" height="164" rx="10" fill="#fff" stroke="#cfdce7"/><path d="M590 304 H1042" stroke="#277c78" stroke-width="4"/><text x="596" y="336" font-size="18" fill="#193951" font-weight="700" text-anchor="start">base_UUID  /  optimum_UUID</text><path d="M580 351 H1052" stroke="#e5edf3"/><text x="596" y="376" font-size="15.5" fill="#43566d" font-weight="400" text-anchor="start">각 실행의 기준안 / 최적화안 재생 테이블</text><text x="596" y="400" font-size="15.5" fill="#43566d" font-weight="400" text-anchor="start">PK  id : BIGSERIAL</text><text x="596" y="424" font-size="15.5" fill="#43566d" font-weight="400" text-anchor="start">sim_time : DOUBLE PRECISION</text><text x="596" y="448" font-size="15.5" fill="#43566d" font-weight="400" text-anchor="start">data : JSONB  /  created_at : TIMESTAMP</text></g><polyline points="470,202 470,255 270,255 270,304" fill="none" stroke="#67879a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="41" y="246" font-size="16" fill="#43566d" font-weight="400" text-anchor="start">opt_uuid로 분석 결과 JOIN</text><polyline points="590,202 590,255 816,255 816,304" fill="none" stroke="#67879a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="671" y="246" font-size="16" fill="#43566d" font-weight="400" text-anchor="start">opt_uuid로 테이블명 구성</text><text x="28" y="491" font-size="14.5" fill="#43566d" font-weight="400" text-anchor="start">실선: JPA 관계 매핑  ·  점선: UUID / 파일명 기반 논리적 연결  ·  동적 결과 PK는 생성 DDL 기준</text></g></svg>